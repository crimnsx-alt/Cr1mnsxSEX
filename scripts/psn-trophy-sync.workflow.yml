name: PSN Trophy Sync

on:
  schedule:
    # Synchronize trophies automatically every 45 minutes
    - cron: '*/45 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run PSN Trophy Synchronizer
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/sync-psn-trophies.mjs

      - name: Commit and push updated trophy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/psn-trophies.json
          git diff --staged --quiet || (git commit -m "chore(psn): Auto-sync latest trophies from PlayStation Network" && git push)
